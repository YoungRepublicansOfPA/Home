 <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="0.8" fill="#a99b85"/></pattern>
 <marker id="arrow" viewBox="0 0 10 8" refX="8" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 10 4 0 8" fill="#347570"/></marker>
