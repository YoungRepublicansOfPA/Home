 <path d="M385 114v-7m-10 0h20" stroke="#283e40" stroke-width="3"/>
 <text class="label" x="315" y="93">Supply shutoff</text><path class="line" d="M387 97v7"/>
 <path d="M261 165v11" stroke="#39857f" stroke-width="2" stroke-dasharray="2 3"/>
 <text class="small" x="326" y="171">Air gap</text><path class="line" d="M319 167h-48"/>
 <text class="small" x="350" y="267">Dose cup</text><path class="line" d="M347 272h-14l-16 10"/>
</g>
<path d="M34 436h1032" stroke="#cbbfa6"/><text class="ey" x="34" y="471">BAKER’S WORKFLOW</text>
<text class="under" x="34" y="506">1. Collect measured water in cup.</text><text class="under" x="383" y="506">2. Add water, flour and starter to pan.</text><text class="under" x="765" y="506">3. Seat pan and run bake cycle.</text>
<text class="small" x="34" y="541">Water stays in the dispenser until transferred by hand. The donor appliance retains its original chamber and electrical housing.</text>
</svg>
