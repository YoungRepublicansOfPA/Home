  <path d="m12 214 2 7 13 3 1-6m75 19 1 7 13 3 2-6" fill="#3c4540"/>
 </g>
 <g id="water" stroke="#283e40" stroke-width="2.3" stroke-linejoin="round">
  <path d="m0 127 72 18 33-19-1 21-32 20-72-18Z" fill="#ac9475"/>
  <path d="m0 127 32-19 73 18-33 19Z" fill="#e0c8a4"/>
