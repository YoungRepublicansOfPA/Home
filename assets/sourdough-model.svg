<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 575" role="img" aria-labelledby="title desc">
<title id="title">Two sourdough countertop prototypes</title>
<desc id="desc">Each unit has a bread machine with removable baking pan beside a water dispenser. The reservoir version is filled by hand. The plumbed version has a separate supply module that refills the reservoir through an air gap. A removable cup collects measured water. The baker carries it to the pan and adds flour and active starter. Illustrative scale only.</desc>
