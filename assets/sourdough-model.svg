 </g>
</defs>
<style>text{font-family:system-ui,sans-serif;fill:#233e40}.ey{font-size:14px;font-weight:700;letter-spacing:2px;fill:#785d37}.head{font-family:Georgia,serif;font-weight:bold;font-size:33px}.label{font-size:16px;font-weight:650}.small{font-size:14px}.line{fill:none;stroke:#62716a;stroke-width:1.3}.under{font-size:17px}</style>
<rect width="1100" height="575" rx="18" fill="#f8f3e8"/><rect x="10" y="10" width="1080" height="555" rx="14" fill="none" stroke="#d0bf9c"/>
<text class="ey" x="34" y="48">DAILY SOURDOUGH  /  CONCEPT DRAWING</text><text class="small" text-anchor="end" x="1065" y="48">Illustrative scale</text>
<path d="M550 75V438" stroke="#cbbfa6"/>
<g transform="translate(34 82)">
 <text class="head" y="22">Refillable reservoir</text><text class="small" y="48">Fill the side tank at the sink.</text>
